name: release-please
on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}
      - run: npm publish
        if: ${{ steps.release.outputs.release_created }}
      - name: Install mcp-publisher
        if: ${{ steps.release.outputs.release_created }}
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Wait for npm version to be visible
        if: ${{ steps.release.outputs.release_created }}
        # Reason: the MCP Registry rejects the publish until npm serves the new version, which can lag behind `npm publish`.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if npm view "actual-mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "actual-mcp@${VERSION} is available on npm"
              exit 0
            fi
            echo "Attempt ${attempt}/30: actual-mcp@${VERSION} not visible yet, retrying in 10s"
            sleep 10
          done
          echo "actual-mcp@${VERSION} still not visible on npm after 5 minutes" >&2
          exit 1
      - name: Authenticate to MCP Registry
        if: ${{ steps.release.outputs.release_created }}
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        if: ${{ steps.release.outputs.release_created }}
        run: ./mcp-publisher publish
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: ${{ steps.release.outputs.release_created }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/actual-mcp:${{ steps.release.outputs.tag_name }},${{ secrets.DOCKER_USERNAME }}/actual-mcp:latest
